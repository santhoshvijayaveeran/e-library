server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;   # <- DOMAIN (or EC2 IP) maathunga

    client_max_body_size 100M;      # PDF upload-ku

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/ubuntu/E-library/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Paid PDFs direct-a access aaga koodadhu -> Django view vazhiya mattum
    location /media/books/ {
        deny all;
        return 404;
    }

    location /media/ {
        alias /home/ubuntu/E-library/media/;
        expires 7d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_pass http://unix:/run/gunicorn-sanza/gunicorn.sock;
    }
}
